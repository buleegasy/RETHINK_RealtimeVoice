name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: TypeCheck, Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Monorepo TypeCheck
        run: npm run typecheck

      - name: Run Tests with Coverage
        run: |
          npm run test:coverage
          sed -i.bak 's|^SF:src/|SF:web/src/|' web/coverage/lcov.info
          sed -i.bak 's|^SF:src/|SF:worker/src/|' worker/coverage/lcov.info

      - name: Build Web Application
        run: npm run build

      - name: SonarCloud Code Analysis
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
