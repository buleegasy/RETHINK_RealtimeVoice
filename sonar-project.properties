# SonarCloud Configuration for RETHINK-Realtime
sonar.projectKey=buleegasy_RETHINK-Realtime
sonar.organization=buleegasy

# Define source and test directories
sonar.sources=web/src,worker/src
sonar.tests=web/test,worker/test

# Exclude generated code, build output, and migrations from analysis
sonar.exclusions=dist/**,node_modules/**,worker/migrations/**

# Exclude test files and migrations from duplicate code detection (CPD)
sonar.cpd.exclusions=web/test/**,worker/test/**,worker/migrations/**,**/knowledge/**,**/capsules/**

# Test coverage report paths
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info,worker/coverage/lcov.info

